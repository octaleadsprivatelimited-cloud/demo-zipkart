  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ZIPCART",
    "url": "https://zipcartgroceries.com",
    "logo": "https://zipcartgroceries.com/zipcart-logo.png",
    "description": "Fast grocery delivery service delivering fresh products in 10 minutes",
    "sameAs": [
      "https://facebook.com/zipcart",
      "https://twitter.com/zipcart",
      "https://instagram.com/zipcart",
      "https://linkedin.com/company/zipcart"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+91-XXXXXXXXXX",
      "contactType": "customer service",
      "availableLanguage": ["English", "Hindi"]
    }
  }
  </script>

  <!-- Structured Data - Local Business -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "GroceryStore",
    "name": "ZIPCART",
    "image": "https://zipcartgroceries.com/zipcart-logo.png",
    "url": "https://zipcartgroceries.com",
    "telephone": "+91-XXXXXXXXXX",
    "priceRange": "₹₹",
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
      "opens": "00:00",
      "closes": "23:59"
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Grocery & Daily Essentials",
      "itemListElement": [
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Fresh Vegetables"}},
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Dairy Products"}},
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Beverages"}},
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Snacks & Namkeens"}}
      ]
    }
  }
  </script>
